<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>Нет связи — Maestro</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid; place-items: center; min-height: 100dvh; padding: 40px 20px;
      background: #F5F2EA; color: #2B2A28; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 360px; }
    img { display: block; width: 72px; height: 72px; margin: 0 auto; border-radius: 16px; }
    h1 { margin: 24px 0 0; font: 500 28px/1.2 Georgia, "Times New Roman", serif; }
    p { margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #5D564C; }
    button {
      margin-top: 28px; width: 100%; min-height: 44px; padding: 12px 20px;
      border: 1px solid #C59A44; border-radius: 12px; background: #F5C45C; color: #0D0D0D;
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    }
    a {
      display: flex; align-items: center; justify-content: center; margin-top: 8px; min-height: 44px;
      padding: 12px 20px; border: 1px solid #CFC8BC; border-radius: 12px; background: #FCFBF8;
      color: #2B2A28; font-size: 14px; font-weight: 600; text-decoration: none;
    }
    button:focus-visible, a:focus-visible { outline: 2px solid #7A571C; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/guitar-avatar.png" alt="Maestro">
    <h1>Нет связи</h1>
    <p>Как только интернет появится, Maestro откроется сам.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
    <a href="/dashboard">На главную</a>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
